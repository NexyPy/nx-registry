[project]
name = "nx-registry"
version = "0.1.0"
description = "Module registry for Nexy"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115", "uvicorn>=0.34"]

[dependency-groups]
dev = [
    "bandit>=1.8",
    "mypy>=1.18",
    "pytest>=9.0",
    "pytest-cov>=7.0",
    "ruff>=0.14",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nx_registry"]

[tool.pytest.ini_options]
addopts = "--cov=nx_registry --cov-report=term-missing --cov-fail-under=100"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["nx_registry"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.mypy]
strict = true
python_version = "3.12"
files = ["src", "tests"]

[tool.bandit]
exclude_dirs = [".venv", "tests"]
